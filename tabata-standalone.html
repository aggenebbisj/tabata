  <style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-2: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #22c55e;
  --accent-press: #16a34a;
  --work: #22c55e;
  --rest: #f59e0b;
  --setrest: #3b82f6;
  --ready: #64748b;
  --done: #a855f7;
  --danger: #ef4444;
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
}

body {
  padding:
    calc(env(safe-area-inset-top) + 12px)
    calc(env(safe-area-inset-right) + 16px)
    calc(env(safe-area-inset-bottom) + 16px)
    calc(env(safe-area-inset-left) + 16px);
  min-height: 100dvh;
}

.view { display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.hidden { display: none !important; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.top h1 { font-size: 34px; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
.top h2 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; text-align: center; }

/* Buttons */
.btn {
  border: none;
  border-radius: var(--radius);
  font-size: 18px;
  font-weight: 700;
  padding: 14px 18px;
  color: var(--text);
  background: var(--surface-2);
  cursor: pointer;
  transition: transform 0.05s ease, background 0.15s ease;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn-accent { background: var(--accent); color: #06230f; }
.btn-accent:active { background: var(--accent-press); }
.btn-ghost { background: transparent; color: var(--muted); padding: 10px 12px; }
.btn-ghost.danger { color: var(--danger); }
.btn.big { width: 100%; padding: 20px; font-size: 22px; }

.hint { color: var(--muted); text-align: center; margin-top: 40px; }

/* Preset list */
.preset-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.preset-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.preset-card .play {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
  min-width: 0;
}
.preset-card .pname { font-size: 20px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset-card .pmeta { font-size: 13px; color: var(--muted); }
.preset-card .edit {
  background: var(--surface-2);
  border: none;
  color: var(--muted);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.preset-card .edit:active { transform: scale(0.95); }

/* Editor */
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 14px; color: var(--muted); font-weight: 600; }
.field input {
  background: var(--surface);
  border: 1px solid var(--surface-2);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 20px;
  padding: 14px 16px;
  width: 100%;
}
.field input:focus { outline: none; border-color: var(--accent); }

.steppers { display: flex; flex-direction: column; gap: 10px; }
.stepper {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.stepper .slabel { flex: 1; min-width: 0; }
.stepper .slabel .name { font-size: 16px; font-weight: 700; }
.stepper .slabel .sub { font-size: 12px; color: var(--muted); }
.stepper .sval { font-size: 26px; font-weight: 800; min-width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button {
  width: 52px; height: 52px;
  border-radius: 14px;
  border: none;
  background: var(--surface-2);
  color: var(--text);
  font-size: 28px;
  font-weight: 800;
  cursor: pointer;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.stepper button:active { transform: scale(0.92); background: var(--accent); color: #06230f; }

/* Run screen */
#run { justify-content: space-between; }
.run-stage {
  flex: 1;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.25s ease;
  background: var(--surface);
}
.run-stage.ready { background: var(--ready); }
.run-stage.work { background: var(--work); color: #06230f; }
.run-stage.rest { background: var(--rest); color: #3d2600; }
.run-stage.setrest { background: var(--setrest); }
.run-stage.done { background: var(--done); }
.run-stage.paused { filter: brightness(0.6); }

.phase-label { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
.big-time { font-size: 34vw; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.progress { font-size: 20px; font-weight: 700; opacity: 0.85; }
.next-up { font-size: 15px; font-weight: 600; opacity: 0.7; min-height: 18px; }

.run-controls { display: flex; gap: 12px; align-items: center; }
.run-controls .btn.big { flex: 1; }

</style>
</head>
<body>
  <!-- HOME -->
  <section id="home" class="view">
    <header class="top">
      <h1>Tabata</h1>
      <button id="newBtn" class="btn btn-accent">＋ New</button>
    </header>
    <ul id="presetList" class="preset-list"></ul>
    <p id="emptyHint" class="hint hidden">No workouts yet. Tap <b>＋ New</b> to create one.</p>
  </section>

  <!-- EDITOR -->
  <section id="editor" class="view hidden">
    <header class="top">
      <button id="editorBack" class="btn btn-ghost">‹ Back</button>
      <h2 id="editorTitle">New workout</h2>
      <button id="deleteBtn" class="btn btn-ghost danger hidden">Delete</button>
    </header>
    <label class="field">
      <span>Name</span>
      <input id="nameInput" type="text" inputmode="text" placeholder="My workout" autocomplete="off" />
    </label>
    <div id="steppers" class="steppers"></div>
    <button id="saveBtn" class="btn btn-accent big">Save</button>
  </section>

  <!-- RUN -->
  <section id="run" class="view hidden">
    <div id="runStage" class="run-stage">
      <div id="phaseLabel" class="phase-label">Get Ready</div>
      <div id="bigTime" class="big-time">0</div>
      <div id="progress" class="progress">Rep 0/0 · Set 0/0</div>
      <div id="nextUp" class="next-up"></div>
    </div>
    <div class="run-controls">
      <button id="stopBtn" class="btn btn-ghost">Stop</button>
      <button id="pauseBtn" class="btn btn-accent big">Pause</button>
    </div>
  </section>

  <script>
"use strict";

/* ---------- Storage ---------- */
const PRESETS_KEY = "tabata.presets";
const LAST_KEY = "tabata.lastId";

const DEFAULT_PRESET = {
  name: "",
  countdown: 10,
  workSec: 20,
  reps: 8,
  restSec: 10,
  sets: 1,
  setRestSec: 60,
};

const FIELDS = [
  { key: "countdown",  name: "Start countdown",   sub: "seconds",          min: 0, max: 60,  step: 5 },
  { key: "workSec",    name: "Interval (work)",   sub: "seconds",          min: 1, max: 600, step: 5 },
  { key: "reps",       name: "Intervals / reps",  sub: "per set",          min: 1, max: 100, step: 1 },
  { key: "restSec",    name: "Rest between reps", sub: "seconds",          min: 0, max: 300, step: 5 },
  { key: "sets",       name: "Sets",              sub: "repeat all reps",  min: 1, max: 50,  step: 1 },
  { key: "setRestSec", name: "Rest between sets", sub: "seconds",          min: 0, max: 600, step: 5 },
];

function loadPresets() {
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch {
    return [];
  }
}
function savePresets(list) {
  localStorage.setItem(PRESETS_KEY, JSON.stringify(list));
}
function newId() {
  return "p" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
}

let presets = loadPresets();

/* ---------- View switching ---------- */
const views = {
  home: document.getElementById("home"),
  editor: document.getElementById("editor"),
  run: document.getElementById("run"),
};
function show(name) {
  for (const k in views) views[k].classList.toggle("hidden", k !== name);
}

/* ---------- Home ---------- */
const presetList = document.getElementById("presetList");
const emptyHint = document.getElementById("emptyHint");

function fmtTime(s) {
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  const r = s % 60;
  return r ? `${m}m${r}s` : `${m}m`;
}
function presetSummary(p) {
  const parts = [`${p.reps}×${fmtTime(p.workSec)} work`];
  if (p.restSec) parts.push(`${fmtTime(p.restSec)} rest`);
  if (p.sets > 1) parts.push(`${p.sets} sets`);
  return parts.join(" · ");
}

function renderHome() {
  presetList.innerHTML = "";
  emptyHint.classList.toggle("hidden", presets.length > 0);
  for (const p of presets) {
    const li = document.createElement("li");
    li.className = "preset-card";

    const play = document.createElement("div");
    play.className = "play";
    play.innerHTML = `<div class="pname"></div><div class="pmeta"></div>`;
    play.querySelector(".pname").textContent = p.name || "Untitled";
    play.querySelector(".pmeta").textContent = presetSummary(p);
    play.addEventListener("click", () => openRun(p));

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => openEditor(p));

    li.appendChild(play);
    li.appendChild(edit);
    presetList.appendChild(li);
  }
}

document.getElementById("newBtn").addEventListener("click", () => openEditor(null));

/* ---------- Editor ---------- */
const nameInput = document.getElementById("nameInput");
const steppersEl = document.getElementById("steppers");
const editorTitle = document.getElementById("editorTitle");
const deleteBtn = document.getElementById("deleteBtn");
let editing = null; // preset being edited, or null for new
let draft = null;

function clamp(v, f) {
  return Math.max(f.min, Math.min(f.max, v));
}

function renderSteppers() {
  steppersEl.innerHTML = "";
  for (const f of FIELDS) {
    const row = document.createElement("div");
    row.className = "stepper";
    row.innerHTML = `
      <button type="button" aria-label="decrease">−</button>
      <div class="slabel"><div class="name"></div><div class="sub"></div></div>
      <div class="sval"></div>
      <button type="button" aria-label="increase">＋</button>`;
    row.querySelector(".name").textContent = f.name;
    row.querySelector(".sub").textContent = f.sub;
    const valEl = row.querySelector(".sval");
    const update = () => { valEl.textContent = draft[f.key]; };
    update();

    const [minus, , , plus] = row.children;
    const bump = (dir) => {
      draft[f.key] = clamp(draft[f.key] + dir * f.step, f);
      update();
    };
    holdRepeat(minus, () => bump(-1));
    holdRepeat(plus, () => bump(1));
    steppersEl.appendChild(row);
  }
}

// Tap once; hold to repeat (accelerating).
function holdRepeat(btn, fn) {
  let timer = null;
  let delay = 400;
  const step = () => {
    fn();
    delay = Math.max(60, delay * 0.8);
    timer = setTimeout(step, delay);
  };
  const start = (e) => {
    e.preventDefault();
    fn();
    delay = 400;
    timer = setTimeout(step, delay);
  };
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", stop);
  btn.addEventListener("pointerleave", stop);
  btn.addEventListener("pointercancel", stop);
}

function openEditor(preset) {
  editing = preset;
  draft = Object.assign({}, DEFAULT_PRESET, preset || {});
  nameInput.value = preset ? preset.name : "";
  editorTitle.textContent = preset ? "Edit workout" : "New workout";
  deleteBtn.classList.toggle("hidden", !preset);
  renderSteppers();
  show("editor");
}

document.getElementById("editorBack").addEventListener("click", () => {
  renderHome();
  show("home");
});

document.getElementById("saveBtn").addEventListener("click", () => {
  const name = nameInput.value.trim();
  draft.name = name || "Workout";
  if (editing) {
    Object.assign(editing, draft);
  } else {
    editing = Object.assign({ id: newId() }, draft);
    presets.push(editing);
  }
  savePresets(presets);
  renderHome();
  show("home");
});

deleteBtn.addEventListener("click", () => {
  if (!editing) return;
  if (!confirm(`Delete "${editing.name || "Workout"}"?`)) return;
  presets = presets.filter((p) => p.id !== editing.id);
  savePresets(presets);
  renderHome();
  show("home");
});

/* ---------- Audio (Web Audio, generated tones) ---------- */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, durMs, when = 0, gain = 0.25) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.setValueAtTime(gain, t0 + durMs / 1000 - 0.02);
  g.gain.linearRampToValueAtTime(0, t0 + durMs / 1000);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + durMs / 1000 + 0.02);
}
const beepCountdown = () => tone(880, 120);
const beepWork = () => tone(1200, 350);
const beepRest = () => tone(520, 350);
const beepDone = () => { tone(1000, 180, 0); tone(1000, 180, 0.25); tone(1320, 400, 0.5); };

/* ---------- Wake lock ---------- */
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch { /* ignore */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && engine && engine.running && !engine.paused) {
    acquireWakeLock();
  }
});

/* ---------- Timeline ---------- */
function buildTimeline(p) {
  const segs = [];
  if (p.countdown > 0) segs.push({ phase: "ready", dur: p.countdown, label: "Get Ready" });
  for (let s = 1; s <= p.sets; s++) {
    for (let r = 1; r <= p.reps; r++) {
      segs.push({ phase: "work", dur: p.workSec, label: "Work", rep: r, set: s });
      if (r < p.reps && p.restSec > 0)
        segs.push({ phase: "rest", dur: p.restSec, label: "Rest", rep: r, set: s });
    }
    if (s < p.sets && p.setRestSec > 0)
      segs.push({ phase: "setrest", dur: p.setRestSec, label: "Set Rest", set: s });
  }
  segs.push({ phase: "done", dur: 0, label: "Done" });
  return segs;
}

/* ---------- Run engine ---------- */
const runStage = document.getElementById("runStage");
const phaseLabel = document.getElementById("phaseLabel");
const bigTime = document.getElementById("bigTime");
const progressEl = document.getElementById("progress");
const nextUpEl = document.getElementById("nextUp");
const pauseBtn = document.getElementById("pauseBtn");

let engine = null;
let current = null; // current preset

function openRun(p) {
  current = p;
  localStorage.setItem(LAST_KEY, p.id);
  initAudio(); // unlock audio on this user gesture
  startEngine(p);
  acquireWakeLock();
  show("run");
}

function startEngine(p) {
  const segs = buildTimeline(p);
  engine = {
    preset: p,
    segs,
    idx: 0,
    endAt: 0,
    remaining: 0,   // ms remaining when paused
    lastSec: -1,
    running: true,
    paused: false,
    tick: null,
  };
  enterSegment(0, true);
  engine.tick = setInterval(loop, 100);
  pauseBtn.textContent = "Pause";
}

function enterSegment(idx, first) {
  const seg = engine.segs[idx];
  engine.idx = idx;
  engine.lastSec = -1;

  runStage.className = "run-stage " + seg.phase;
  phaseLabel.textContent = seg.label;

  if (seg.phase === "done") {
    bigTime.textContent = "✓";
    progressEl.textContent = "Workout complete";
    nextUpEl.textContent = "";
    beepDone();
    finish();
    return;
  }

  // progress text
  const P = engine.preset;
  if (seg.phase === "ready") progressEl.textContent = P.sets > 1 ? `Set 1/${P.sets}` : "Starting…";
  else if (seg.phase === "setrest") progressEl.textContent = `Set ${seg.set}/${P.sets} done`;
  else progressEl.textContent = `Rep ${seg.rep}/${P.reps} · Set ${seg.set}/${P.sets}`;

  // next up
  const nxt = engine.segs[idx + 1];
  nextUpEl.textContent = nxt && nxt.phase !== "done"
    ? `Next: ${nxt.label}${nxt.dur ? " " + nxt.dur + "s" : ""}`
    : (nxt && nxt.phase === "done" ? "Last one!" : "");

  // entry tone (skip on the very first countdown so it isn't jarring)
  if (!first || seg.phase !== "ready") {
    if (seg.phase === "work") beepWork();
    else if (seg.phase === "rest" || seg.phase === "setrest") beepRest();
  }

  engine.endAt = performance.now() + seg.dur * 1000;
  bigTime.textContent = seg.dur;
}

function loop() {
  if (!engine || !engine.running || engine.paused) return;
  const remainMs = engine.endAt - performance.now();
  const secs = Math.max(0, Math.ceil(remainMs / 1000));

  if (secs !== engine.lastSec) {
    engine.lastSec = secs;
    bigTime.textContent = secs;
    if (secs >= 1 && secs <= 3) beepCountdown();
  }

  if (remainMs <= 0) {
    enterSegment(engine.idx + 1, false);
  }
}

function pauseToggle() {
  if (!engine || !engine.running) return;
  if (!engine.paused) {
    engine.paused = true;
    engine.remaining = engine.endAt - performance.now();
    runStage.classList.add("paused");
    pauseBtn.textContent = "Resume";
    releaseWakeLock();
  } else {
    engine.paused = false;
    engine.endAt = performance.now() + engine.remaining;
    runStage.classList.remove("paused");
    pauseBtn.textContent = "Pause";
    initAudio();
    acquireWakeLock();
  }
}

function finish() {
  if (engine) { clearInterval(engine.tick); engine.running = false; }
  releaseWakeLock();
  pauseBtn.textContent = "Done";
}

function stopRun() {
  if (engine) { clearInterval(engine.tick); engine.running = false; }
  releaseWakeLock();
  renderHome();
  show("home");
}

pauseBtn.addEventListener("click", () => {
  if (engine && !engine.running) { stopRun(); return; } // "Done" acts as back
  pauseToggle();
});
document.getElementById("stopBtn").addEventListener("click", stopRun);

/* ---------- Boot ---------- */
renderHome();
show("home");



</script>
</body>
</html>
